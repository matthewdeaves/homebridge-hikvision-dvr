<div id="console" class="card card-body mb-3" style="display:none">
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
    <strong>Web console</strong>
    <a id="open" class="btn btn-primary btn-sm" href="#" target="_blank" rel="noopener">Open web console</a>
  </div>
  <p id="note" class="text-muted small mt-2 mb-0"></p>
  <iframe id="frame" title="DVR web console" class="mt-3 w-100 border rounded" style="height:640px;display:none"></iframe>
</div>

<script>
(async () => {
  homebridge.showSchemaForm();
  const box = document.getElementById('console');
  const note = document.getElementById('note');
  try {
    const info = await homebridge.request('/console-info');
    box.style.display = '';
    if (!info.enabled) {
      note.textContent = 'The web console is off. Turn on "Web console" under Web console below, save, and restart Homebridge to use it.';
      document.getElementById('open').style.display = 'none';
    } else {
      // The console is plain HTTP on the Homebridge host, so build the URL from where this page was loaded.
      const url = `http://${window.location.hostname}:${info.port}/`;
      document.getElementById('open').href = url;
      if (window.location.protocol === 'https:') {
        note.textContent = 'The Homebridge UI is on HTTPS, so the browser blocks embedding the plain HTTP console here. Use the button to open it in its own tab.';
      } else {
        note.textContent = url;
        const frame = document.getElementById('frame');
        frame.src = url;
        frame.style.display = '';
      }
    }
  } catch (e) {
    // No console section if the server side isn't reachable; the settings form still works.
  }
  homebridge.fixScrollHeight();
})();
</script>
